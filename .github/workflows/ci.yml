name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (shellcheck)
    uses: DevOpsDerek/workflows/.github/workflows/lint-shell.yml@30f86d7d8536364b0a31de4bc66214b39e8785bb
    with:
      shellcheck-version: 0.10.0
      working-directory: .

  test:
    name: Test (bats-core)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: |
          git clone https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
      - name: Run tests
        run: |
          bats --tap tests/ | tee test-results.tap
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-test-results
          path: test-results.tap

  validate-automation:
    name: Validate GitHub automation
    uses: DevOpsDerek/workflows/.github/workflows/validate-agentic-workflows.yml@dac4b81c298cb3ea6821ea312efa5375f42d5ccb
    with:
      gh-aw-version: v0.89.21
      workflows-directory: .github/workflows
